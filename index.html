<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Vignettes - La Presse</title>
    <!-- Import de la police Verlag (ou alternative Verlag-like Bold) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: Arial, sans-serif; display: flex; gap: 30px; padding: 20px; background: #f0f2f5; }
        .controls { width: 350px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls label { display: block; margin-top: 15px; margin-bottom: 8px; font-weight: bold; }
        .controls textarea, .controls input { width: 100%; padding: 8px; box-sizing: border-box; }

        .preview-container { position: relative; width: 600px; height: 750px; background: #ddd; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #bg-image { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        #logo { position: absolute; top: 25px; right: 25px; width: 65px; height: 65px; object-fit: contain; }

        .text-box {
            position: absolute; bottom: 55px; left: 55px; right: 55px;
            display: flex; flex-direction: column; align-items: flex-start; gap: 0px;
        }

        /* Surtitre en Verlag Bold (25px) */
        #surtitre-output {
            font-family: 'Montserrat', 'Verlag', sans-serif;
            font-weight: 700;
            font-size: 25px;
            color: #FFFFFF;
            background-color: #E1001A;
            padding: 4px 8px;
            display: none;
        }

        /* Titre principal en Verlag Bold (40px) */
        .title-line {
            font-family: 'Montserrat', 'Verlag', sans-serif;
            font-weight: 700;
            font-size: 40px;
            color: #000000;
            background-color: #FFFFFF;
            padding: 4px 8px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            letter-spacing: -1px;
        }

        /* Style du curseur rouge */
        .cursor-l {
            color: #E1001A;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Paramètres</h3>
        <label>Surtitre (facultatif) :</label>
        <input type="text" id="surtitreInput" placeholder="Ex: En direct">

        <label>Titre principal :</label>
        <textarea id="textInput" rows="3">C'est le temps d'essayer le curseur avec un seul espace.</textarea>

        <label>Image de fond :</label>
        <input type="file" id="imageUpload" accept="image/jpeg, image/png, image/webp">
    </div>

    <div class="preview-container">
        <img id="bg-image" src="https://picsum.photos/1080/1350" alt="Fond">
        <img id="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/2012_logo_for_La_Presse_newspaper.svg/960px-2012_logo_for_La_Presse_newspaper.svg.png" alt="Logo">
        
        <div class="text-box" id="output-container">
            <span id="surtitre-output"></span>
        </div>
    </div>

<script>
    const imageUpload = document.getElementById('imageUpload');
    const bgImage = document.getElementById('bg-image');
    const surtitreInput = document.getElementById('surtitreInput');
    const surtitreOutput = document.getElementById('surtitre-output');
    const textInput = document.getElementById('textInput');
    const outputContainer = document.getElementById('output-container');

    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => bgImage.src = e.target.result;
            reader.readAsDataURL(file);
        }
    });

    function updateText() {
        let surtitreText = surtitreInput.value.replace(/'/g, '’');
        if (surtitreText.trim() !== "") {
            surtitreOutput.style.display = "inline-block";
            surtitreOutput.textContent = surtitreText;
        } else {
            surtitreOutput.style.display = "none";
        }

        let titleText = textInput.value.replace(/'/g, '’');
        const lines = titleText.split('\n');

        const existingLines = outputContainer.querySelectorAll('.title-line');
        existingLines.forEach(el => el.remove());

        lines.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'title-line';
            
            // Si c'est la dernière ligne, on ajoute un seul espace et le "l" minuscule rouge
            if (index === lines.length - 1) {
                div.textContent = line;
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor-l';
                cursorSpan.textContent = '\u00A0l';
                div.appendChild(cursorSpan);
            } else {
                div.textContent = line;
            }

            outputContainer.appendChild(div);
        });
    }

    surtitreInput.addEventListener('input', updateText);
    textInput.addEventListener('input', updateText);

    updateText();
</script>
</body>
</html>
